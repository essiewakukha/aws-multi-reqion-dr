AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Secondary-region backup vault. Deploy this FIRST, in the secondary region,
  so its ARN can be passed as SecondaryVaultArn to backup-primary.yaml.

Parameters:
  BackupVaultName:
    Type: String
    Default: prod-backup-vault-secondary

Resources:
  SecondaryBackupVault:
    Type: AWS::Backup::BackupVault
    Properties:
      BackupVaultName: !Ref BackupVaultName
      # No EncryptionKeyArn set - AWS Backup uses its own AWS-managed key
      # (aws/backup) by default, which avoids the ~$1/month customer-managed
      # KMS key cost. Fine for a lab; use a customer-managed key in production
      # if you need key rotation/audit control beyond the managed default.

Outputs:
  SecondaryVaultArn:
    Value: !GetAtt SecondaryBackupVault.BackupVaultArn
    Description: Pass this as SecondaryVaultArn when deploying backup-primary.yaml